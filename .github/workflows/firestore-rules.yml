# Publish firestore.rules to the Firebase project whenever it changes on master.
#
# The rules file has always been in the repo. That is not the same as being in
# force: Firestore evaluates a ruleset stored inside the Firebase PROJECT, and
# the copy in git is inert text until something uploads it. For most of this
# repo's life that upload was a command somebody had to remember, and it went
# unremembered long enough that the deployed ruleset still predated b9a59d4 —
# the commit adding `match /highWater/{uid}`. Everything unmatched falls to the
# catch-all deny at the bottom of the file, so every high-water write was
# refused for weeks, silently, because App.jsx reports that failure to the
# console and nowhere else. The backup feature was shipped, tested, and doing
# nothing, and it was discovered the day somebody needed to restore.
#
# This is what makes "the rules are in the repo" a fact rather than a hope.
#
# ORDERING. Netlify's site build and this workflow both fire on a push to master
# and race; rules land in seconds, a site build takes minutes, so the rules win.
# That is the safe order for a change that WIDENS what is allowed — new rules
# plus the code that needs them, which is what b9a59d4 was — and the wrong one
# for a change that tightens, where the restriction goes live before the code
# that accommodates it. There is one production Firestore and no per-branch
# rulesets, so this is inherent to the setup rather than something CI adds. Ship
# a tightening change in two merges: the code first, the rules after.
name: Deploy Firestore rules

on:
  # Manual runs serve two purposes: proving the credential works without having
  # to touch the rules to find out, and re-asserting the repo's ruleset after
  # somebody edits it in the Firebase console — an edit the paths filter below
  # cannot possibly see.
  workflow_dispatch:
  push:
    branches: [master]
    # Only when the rules, or the configuration that deploys them, actually
    # change. A project stores a bounded number of rulesets, and republishing an
    # identical one on every merge to master spends that budget saying nothing.
    paths:
      - firestore.rules
      - firebase.json
      - .firebaserc
      - .github/workflows/firestore-rules.yml

# Two merges landing together must not race to publish different rulesets: the
# one finishing last would win silently, and it need not be the later commit.
# Never cancel a run already in progress — a half-finished deploy is worse than
# a queued one.
concurrency:
  group: firestore-rules
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The key goes to a file by way of the environment, never a command line:
      # the CLI reads it from GOOGLE_APPLICATION_CREDENTIALS, and an argument is
      # the one place a secret can still surface in a log or a process listing.
      - name: Authenticate to Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not set. Add the service account JSON as a repository secret before merging a rules change."
            exit 1
          fi
          printf '%s\n' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/service-account.json" >> "$GITHUB_ENV"

      # Pinned to a major, unlike the `@latest` a person at a keyboard is told to
      # use. This runs unattended and rarely, so a major release changing how a
      # production ruleset is published is something to opt into deliberately
      # rather than to discover during an incident.
      #
      # --project is passed explicitly even though .firebaserc names the same
      # one: a service account has no "active project" the way an interactive
      # login does, and CI is the worst place to learn which of the two the CLI
      # was waiting for.
      - name: Deploy rules
        run: npx --yes firebase-tools@15 deploy --only firestore:rules --project cocktail-flashcards --non-interactive
