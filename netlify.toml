[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Firebase's client-side config values (below) are not secrets — security is enforced by
# Firestore security rules, not by hiding these. Skip Netlify's secret scanner for them so
# builds don't fail when these values coincidentally match strings elsewhere in the repo.
#
# VITE_ADMIN_EMAILS belongs on this list for the same reason. Every VITE_ variable is
# inlined into the client bundle by design, and this one only hides the admin UI — the
# actual boundary is the admins() list in firestore.rules, which already carries the same
# addresses in plaintext. Without the exemption the scanner finds it in dist/assets and
# fails every build with exit code 2.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID,VITE_ADMIN_EMAILS"

# The Android app config carries the same kind of public Firebase client key, but as a
# literal in a committed file rather than an env var — so SECRETS_SCAN_OMIT_KEYS above
# does not cover it and Netlify's smart detection fails the build on it. The file exists
# purely for the Capacitor/Play build (it supplies R.string.default_web_client_id for
# native Google sign-in, see docs/mobile-google-signin.md) and nothing under android/ is
# ever served, so exclude the path outright instead of pasting the key value here or
# switching smart detection off across the whole repo.
  SECRETS_SCAN_OMIT_PATHS = "android/app/google-services.json"

# Serve the privacy policy at a clean /privacy URL. Must stay ABOVE the SPA
# catch-all: redirects are matched in order, so /* would otherwise swallow it and
# return the app shell. Play Console and AdSense both want a stable policy URL.
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

# SPA catch-all. MUST stay last.
#
# The generated recipe pages (/cocktails/<slug>/, see scripts/seo-pages.mjs) are
# real files in dist, and Netlify serves an existing file in preference to a
# rewrite rule — so this does not swallow them. That precedence is exactly why
# the rule below must never gain `force = true`: forcing it would shadow all 321
# static pages with the empty app shell and silently undo the whole of docs/seo.md.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
